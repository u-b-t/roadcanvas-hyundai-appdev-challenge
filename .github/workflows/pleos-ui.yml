name: Pleos UI test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  ui-test:
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Remove previous build outputs
        run: ./gradlew :app:clean --no-daemon
      - name: Prepare Pleos emulator
        shell: bash
        run: |
          set -euo pipefail
          sdk=''
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Library/Android/sdk" /opt/homebrew/share/android-commandlinetools; do
            if [ -x "$candidate/platform-tools/adb" ] && [ -x "$candidate/emulator/emulator" ]; then
              sdk="$candidate"
              break
            fi
          done
          if [ -z "$sdk" ]; then
            echo 'Android SDK와 에뮬레이터 도구를 찾을 수 없습니다.' >&2
            exit 1
          fi
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          adb="$sdk/platform-tools/adb"
          emulator="$sdk/emulator/emulator"
          image="$sdk/system-images/android-34/pleos_car_emulator/arm64-v8a"
          if [ ! -f "$image/system.img" ]; then
            available_kb=$(df -Pk "$sdk" | awk 'NR == 2 {print $4}')
            if [ "$available_kb" -lt 30000000 ]; then
              echo "Pleos 설치 공간 부족: ${available_kb}KB" >&2
              exit 1
            fi
            archive="$RUNNER_TEMP/pleos-system-image.zip"
            unpacked="$RUNNER_TEMP/pleos-system-image"
            mkdir -p "$unpacked"
            curl --fail --location --retry 3 --continue-at - --output "$archive" 'https://nexus-playground.pleos.ai/repository/raw-releases/connect-avd/2.x/crp_car_arm64_emulator.zip'
            printf '%s  %s\n' '24d28eb2f18eba5e87c861a7eb2bdccebb049419' "$archive" | shasum -a 1 -c -
            unzip -q "$archive" -d "$unpacked"
            system_img=$(find "$unpacked" -name system.img -type f -print -quit)
            if [ -z "$system_img" ]; then echo '이미지 압축 파일에 system.img가 없습니다.' >&2; exit 1; fi
            if [ -e "$image" ]; then echo "이미지 대상 경로가 이미 있습니다: $image" >&2; exit 1; fi
            mkdir -p "$(dirname "$image")"
            mv "$(dirname "$system_img")" "$image"
            python3 -c 'from pathlib import Path; import shutil,sys; Path(sys.argv[1]).unlink(); shutil.rmtree(sys.argv[2], ignore_errors=True)' "$archive" "$unpacked"
          fi
          if ! "$emulator" -list-avds | grep -q '^Pleos_Connect$'; then
            python3 -c 'from pathlib import Path; import re,sys; p=Path(sys.argv[1]); f=p/"source.properties"; s=f.read_text(); s=re.sub(r"(?m)^SystemImage.TagId=.*$", "SystemImage.TagId=pleos_car_emulator", s); f.write_text(s); (p/"package.xml").unlink(missing_ok=True)' "$image"
            avdmanager="$sdk/cmdline-tools/latest/bin/avdmanager"
            if [ ! -x "$avdmanager" ]; then echo "avdmanager를 찾을 수 없습니다: $avdmanager" >&2; exit 1; fi
            echo no | "$avdmanager" create avd -n Pleos_Connect -k 'system-images;android-34;pleos_car_emulator;arm64-v8a'
          fi
          "$emulator" -list-avds
          "$adb" devices -l
          mapfile_output=$("$adb" devices | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1}')
          if [ -n "$mapfile_output" ]; then
            if [ "$(printf '%s\n' "$mapfile_output" | wc -l | tr -d ' ')" != 1 ]; then
              echo '에뮬레이터가 여러 개 실행 중입니다. Pleos 대상을 지정해야 합니다.' >&2
              exit 1
            fi
            serial="$mapfile_output"
            avd=$("$adb" -s "$serial" emu avd name | head -1 | tr -d '\r')
          else
            avd=''
            while IFS= read -r candidate; do
              config="$HOME/.android/avd/$candidate.avd/config.ini"
              if [ -f "$config" ] && grep -qi 'pleos' "$config"; then
                if [ -n "$avd" ]; then
                  echo 'Pleos AVD가 여러 개입니다. 대상을 지정해야 합니다.' >&2
                  exit 1
                fi
                avd="$candidate"
              fi
            done < <("$emulator" -list-avds)
            if [ -z "$avd" ]; then
              echo '설치된 시스템 이미지:'
              for images in "$sdk/system-images" "$HOME/android-sdk/system-images"; do
                if [ -d "$images" ]; then find "$images" -maxdepth 4 -name source.properties -print; fi
              done
              echo 'Pleos AVD를 찾을 수 없습니다.' >&2
              exit 1
            fi
            "$emulator" -avd "$avd" -no-snapshot > "$RUNNER_TEMP/pleos-emulator.log" 2>&1 &
            emulator_pid=$!
            serial=emulator-5554
          fi
          config="$HOME/.android/avd/$avd.avd/config.ini"
          if [ ! -f "$config" ] || ! grep -qi 'pleos' "$config"; then
            echo "대상 AVD가 Pleos 이미지인지 확인할 수 없습니다: $avd" >&2
            exit 1
          fi
          echo "ANDROID_SERIAL=$serial" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if [ -n "${emulator_pid:-}" ] && ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo '에뮬레이터 프로세스가 종료됐습니다.' >&2
              tail -100 "$RUNNER_TEMP/pleos-emulator.log"
              exit 1
            fi
            if [ "$("$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo '에뮬레이터 부팅 시간 초과' >&2
          if [ -f "$RUNNER_TEMP/pleos-emulator.log" ]; then tail -100 "$RUNNER_TEMP/pleos-emulator.log"; fi
          exit 1
      - name: Run Cucumber UI tests
        run: python3 scripts/run-device-tests.py
      - name: Find UI test results
        id: results
        if: ${{ !cancelled() }}
        run: |
          files=$(find app/build/outputs/androidTest-results/connected -name 'TEST-*.xml' -type f -print 2>/dev/null | sort | paste -sd, -)
          if [ -n "$files" ]; then
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload UI test results to Codecov
        if: ${{ !cancelled() && steps.results.outputs.files != '' }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          report_type: test_results
          files: ${{ steps.results.outputs.files }}
          disable_search: true
          flags: ui
          fail_ci_if_error: true
