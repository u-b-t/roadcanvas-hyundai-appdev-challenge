name: Pleos UI test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  ui-test:
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    # 콜드 부팅(최대 약 12분)과 UI 테스트가 함께 실행될 수 있다.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Remove previous build outputs
        run: ./gradlew :app:clean --no-daemon
      - name: Prepare Pleos emulator
        # 기존 에뮬레이터가 비정상(user 0 잠김, car_service 없음 등)이면 종료하고 콜드 부팅한다.
        run: scripts/ci-emulator.sh prepare
      - name: Check emulator display
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" shell wm size
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" shell wm density
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" shell dumpsys display | grep -E 'DisplayDeviceInfo|mBaseDisplayInfo' | head -10 || true
      - name: Remove previous app installs
        run: |
          # 다른 기기에서 빌드한 설치본이 남아 있으면 서명 불일치로 테스트 APK 설치가 실패한다.
          # 설치돼 있지 않으면 uninstall이 실패하므로 결과만 기록하고 계속한다.
          for package in kr.roadcanvas.app.test kr.roadcanvas.app; do
            result=$("$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" uninstall "$package" 2>&1 | tr -d '\r' || true)
            echo "$package: $result"
          done
      - name: Run Cucumber UI tests
        id: tests
        shell: bash
        run: python3 scripts/run-device-tests.py 2>&1 | tee "$RUNNER_TEMP/ui-test.log"
      - name: Restart emulator after system crash
        # 시스템 크래시로 중단됐으면 다음 작업이 망가진 에뮬레이터를 받지 않게 재시작한다.
        # 작업 결과는 테스트 단계의 실패로 남는다.
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: scripts/ci-emulator.sh recover "$RUNNER_TEMP/ui-test.log" app/build/outputs/androidTest-results
      - name: Find UI test results
        id: results
        if: ${{ !cancelled() }}
        run: |
          files=$(find app/build/outputs/androidTest-results/connected -name 'TEST-*.xml' -type f -print 2>/dev/null | sort | paste -sd, -)
          if [ -n "$files" ]; then
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload UI test results to Codecov
        if: ${{ !cancelled() && steps.results.outputs.files != '' }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          report_type: test_results
          files: ${{ steps.results.outputs.files }}
          disable_search: true
          flags: ui
          fail_ci_if_error: true
