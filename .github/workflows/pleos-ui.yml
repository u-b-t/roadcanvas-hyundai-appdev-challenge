name: Pleos UI test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  # 같은 PR의 새 push가 이전 실행을 취소한다. main push는 그룹 하나로 묶어 최신 main 실행만 남긴다.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    # 준비·테스트 후 콜드 부팅(각각 최대 약 12분)과 UI 테스트가 함께 실행될 수 있다.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check emulator preparation logic
        run: python3 -m unittest scripts/test_ci_emulator.py
      - name: Check DrivingView isolation
        run: python3 -m unittest scripts/test_ci_drivingview.py
      - name: Remove previous build outputs
        run: ./gradlew :app:clean --no-daemon
      - name: Prepare Pleos emulator
        # 이전 실행의 상태가 남지 않도록 매번 종료한 뒤 콜드 부팅한다.
        run: scripts/ci-emulator.sh prepare
      - name: Check emulator display
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" shell wm size
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" shell wm density
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" shell dumpsys display | grep -E 'DisplayDeviceInfo|mBaseDisplayInfo' | head -10 || true
      - name: Remove previous app installs
        run: |
          # 다른 기기에서 빌드한 설치본이 남아 있으면 서명 불일치로 테스트 APK 설치가 실패한다.
          # 설치돼 있지 않으면 uninstall이 실패하므로 결과만 기록하고 계속한다.
          for package in kr.roadcanvas.app.test kr.roadcanvas.app; do
            result=$("$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" uninstall "$package" 2>&1 | tr -d '\r' || true)
            echo "$package: $result"
          done
      - name: Run Cucumber UI tests
        id: tests
        shell: bash
        run: |
          # 시스템이 크래시하면 logcat 버퍼가 사라질 수 있어 실행 중 관련 로그를 보관한다.
          "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" logcat -v threadtime -s ActivityManager ActivityTaskManager WindowManager Watchdog AndroidRuntime > "$RUNNER_TEMP/ui-system.log" 2>&1 &
          logcat_pid=$!
          trap 'kill "$logcat_pid" 2>/dev/null || true; wait "$logcat_pid" 2>/dev/null || true' EXIT
          set -o pipefail
          if python3 scripts/ci_drivingview.py -- python3 scripts/run-device-tests.py 2>&1 | tee "$RUNNER_TEMP/ui-test.log"; then
            exit 0
          else
            status=$?
            echo '::group::최근 시스템 로그'
            tail -2000 "$RUNNER_TEMP/ui-system.log" || true
            echo '::endgroup::'
            exit "$status"
          fi
      - name: Capture device diagnostics after UI failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        shell: bash
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          # 각 조회는 기기가 응답하지 않아도 제한 시간 뒤 종료한다. 원래 테스트 실패는 유지한다.
          capture() {
            echo "::group::$*"
            perl -e 'alarm 20; exec @ARGV or die "exec: $!\n"' "$adb" -s "$ANDROID_SERIAL" "$@" || echo "조회 실패: $*"
            echo '::endgroup::'
          }
          capture get-state
          capture shell dumpsys activity activities
          capture shell dumpsys window windows
          capture logcat -d -t 2000 -s ActivityManager ActivityTaskManager WindowManager Watchdog AndroidRuntime
      - name: Find UI test results
        id: results
        if: ${{ !cancelled() }}
        run: |
          files=$(find app/build/outputs/androidTest-results/connected -name 'TEST-*.xml' -type f -print 2>/dev/null | sort | paste -sd, -)
          if [ -n "$files" ]; then
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload UI test results to Codecov
        if: ${{ !cancelled() && steps.results.outputs.files != '' }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          report_type: test_results
          files: ${{ steps.results.outputs.files }}
          disable_search: true
          flags: ui
          fail_ci_if_error: true
