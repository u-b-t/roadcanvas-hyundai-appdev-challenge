name: Pleos UI test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-test:
    runs-on: [self-hosted, macOS, ARM64, mac-mini]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Pleos emulator
        shell: bash
        run: |
          set -euo pipefail
          sdk=''
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/Library/Android/sdk" /opt/homebrew/share/android-commandlinetools; do
            if [ -x "$candidate/platform-tools/adb" ] && [ -x "$candidate/emulator/emulator" ]; then
              sdk="$candidate"
              break
            fi
          done
          if [ -z "$sdk" ]; then
            echo 'Android SDK와 에뮬레이터 도구를 찾을 수 없습니다.' >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          adb="$sdk/platform-tools/adb"
          emulator="$sdk/emulator/emulator"
          "$emulator" -list-avds
          "$adb" devices -l
          mapfile_output=$("$adb" devices | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1}')
          if [ -n "$mapfile_output" ]; then
            if [ "$(printf '%s\n' "$mapfile_output" | wc -l | tr -d ' ')" != 1 ]; then
              echo '에뮬레이터가 여러 개 실행 중입니다. Pleos 대상을 지정해야 합니다.' >&2
              exit 1
            fi
            serial="$mapfile_output"
            avd=$("$adb" -s "$serial" emu avd name | head -1 | tr -d '\r')
          else
            avd=''
            while IFS= read -r candidate; do
              config="$HOME/.android/avd/$candidate.avd/config.ini"
              if [ -f "$config" ] && grep -qi 'pleos' "$config"; then
                if [ -n "$avd" ]; then
                  echo 'Pleos AVD가 여러 개입니다. 대상을 지정해야 합니다.' >&2
                  exit 1
                fi
                avd="$candidate"
              fi
            done < <("$emulator" -list-avds)
            if [ -z "$avd" ]; then
              echo 'Pleos AVD를 찾을 수 없습니다.' >&2
              exit 1
            fi
            "$emulator" -avd "$avd" -no-snapshot > "$RUNNER_TEMP/pleos-emulator.log" 2>&1 &
            serial=emulator-5554
          fi
          config="$HOME/.android/avd/$avd.avd/config.ini"
          if [ ! -f "$config" ] || ! grep -qi 'pleos' "$config"; then
            echo "대상 AVD가 Pleos 이미지인지 확인할 수 없습니다: $avd" >&2
            exit 1
          fi
          echo "ANDROID_SERIAL=$serial" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if [ "$("$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo '에뮬레이터 부팅 시간 초과' >&2
          exit 1
      - name: Run Cucumber UI tests
        run: python3 scripts/run-device-tests.py
