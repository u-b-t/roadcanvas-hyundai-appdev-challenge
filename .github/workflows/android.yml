name: Android

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          STRICT_COMMIT_TITLE: '1'
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          .githooks/commit-msg "$RUNNER_TEMP/pr-title"
      - name: Check formatting, Android lint, build and test
        run: ./gradlew ktlintCheck lintDebug assembleDebug assembleDebugAndroidTest :app:unitTestCoverageReport --no-daemon
      - name: Find unit test results
        id: test-results
        if: ${{ !cancelled() }}
        run: |
          result_dir=app/build/test-results/testDebugUnitTest
          if [ -d "$result_dir" ]; then
            files=$(find "$result_dir" -maxdepth 1 -type f -name 'TEST-*.xml' | sort | paste -sd, -)
            if [ -n "$files" ]; then
              echo "files=$files" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Upload unit test results to Codecov
        if: ${{ !cancelled() && steps.test-results.outputs.files != '' }}
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          report_type: test_results
          files: ${{ steps.test-results.outputs.files }}
          disable_search: true
          flags: unit
          fail_ci_if_error: true
      - name: Check unit coverage report
        id: coverage
        run: |
          if [ -f app/build/reports/jacoco/unitTestCoverageReport/unitTestCoverageReport.xml ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ -d app/src/test ] && find app/src/test -type f \( -name '*.kt' -o -name '*.java' \) -print -quit | grep -q .; then
            echo '::error::단위 테스트 소스는 있지만 커버리지 보고서가 생성되지 않았습니다.'
            exit 1
          else
            echo '::notice::단위 테스트 커버리지 보고서가 없습니다. 단위 테스트가 추가되면 Codecov에 업로드합니다.'
          fi
      - name: Upload unit coverage to Codecov
        if: steps.coverage.outputs.available == 'true'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: app/build/reports/jacoco/unitTestCoverageReport/unitTestCoverageReport.xml
          disable_search: true
          flags: unit
          fail_ci_if_error: true
